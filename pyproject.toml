[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfai-review"
version = "0.1.0"
description = "Peer-review entry point for the frozen ResearchForge ranking study"
requires-python = ">=3.10"
authors = [{name="Ariamehr Maleki"}, {name="Amirhossein Keyhanipour"}]
dependencies = []

[project.scripts]
rfai-review = "rfai_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
